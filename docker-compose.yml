services:

  calculator-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: calculator-app

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - calculator-network

  db:
    image: postgres:16.6

    container_name: calculator-db

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - calculator-network

volumes:
  postgres-data:
    name: postgres-data
    external: true

networks:
  calculator-network:
    driver: bridge
