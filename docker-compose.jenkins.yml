# Despliegue local del servidor Jenkins CI:
#   docker compose -f docker-compose.jenkins.yml up -d --build
# Detener:
#   docker compose -f docker-compose.jenkins.yml down

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: calculadora-jenkins-ci:lts-jdk21
    container_name: jenkins-ci
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"   # Panel Web de Jenkins y endpoint de Webhooks GitHub
      - "50000:50000" # Canal de comunicacion para agentes remotos JNLP
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Docker Socket Binding al daemon del host
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home_data
