version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-ci
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"   # Panel Web de Jenkins
      - "50000:50000" # Agentes remotos JNLP
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al daemon de Docker del host
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home_data
