name: CI - Calculadora Docker

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-build:
    name: Construir y probar contenedores
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Descargar el repositorio
      - name: Descargar codigo
        uses: actions/checkout@v4

      # 2. Preparar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Crear archivo de entorno de prueba
      - name: Configurar variables de entorno
        run: cp .env.example .env

      # 4. Validar Docker Compose
      - name: Validar Docker Compose
        run: docker compose config --quiet

      # 5. Construir imagen de la aplicacion
      - name: Construir imagen Python
        run: docker compose build calculator-app

      # 6. Descargar imagen PostgreSQL
      - name: Descargar imagen PostgreSQL
        run: docker compose pull db

      # 7. Crear volumen persistente para CI
      - name: Crear volumen de PostgreSQL
        run: docker volume create postgres-data

      # 8. Levantar los dos servicios
      - name: Iniciar contenedores
        run: docker compose up -d

            # 9. Esperar y probar la aplicacion
      - name: Probar calculadora y PostgreSQL
        run: |
          echo "Esperando que Flask este disponible..."

          for i in {1..30}; do
            if curl -fsS http://localhost:5000/; then
              echo "Aplicacion Flask disponible"
              break
            fi

            echo "Intento $i: esperando Flask..."
            sleep 2
          done

          RESPONSE=$(curl -fsS \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            -X POST http://localhost:5000/calculate \
            -H "Content-Type: application/json" \
            -d '{"numero1":20,"numero2":30,"operacion":"suma"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"resultado":50'
          echo "$RESPONSE" | grep -q '"guardado_en":"db"'

           - name: Diagnosticar errores de contenedores
        if: failure()
        run: |
          echo "=== ESTADO DE CONTENEDORES ==="
          docker compose ps -a

          echo "=== LOGS DE LA APLICACION ==="
          docker compose logs calculator-app

          echo "=== LOGS DE POSTGRESQL ==="
          docker compose logs db

      # 10. Verificar el registro en PostgreSQL
      - name: Verificar datos en PostgreSQL
        run: |
          docker compose exec -T db \
            psql -U admin -d calculadora \
            -c "SELECT * FROM operaciones;"

      # 11. Mostrar los contenedores
      - name: Verificar servicios
        run: docker compose ps

      # 12. Limpiar los contenedores
      - name: Limpiar entorno
        if: always()
        run: docker compose down
