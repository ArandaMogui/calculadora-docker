name: CI - Calculadora Docker

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-build:
    name: Construir y probar contenedores
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Descargar el repositorio
      - name: Descargar codigo
        uses: actions/checkout@v4

      # 2. Preparar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Crear archivo de entorno de prueba
      - name: Configurar variables de entorno
        run: cp .env.example .env

      # 4. Validar Docker Compose
      - name: Validar Docker Compose
        run: docker compose config --quiet

      # 5. Construir imagen de la aplicacion
      - name: Construir imagen Python
        run: docker compose build calculator-app

      # 6. Descargar imagen PostgreSQL
      - name: Descargar imagen PostgreSQL
        run: docker compose pull db

      # 7. Crear volumen persistente para CI
      - name: Crear volumen de PostgreSQL
        run: docker volume create postgres-data

      # 8. Levantar los dos servicios
      - name: Iniciar contenedores
        run: docker compose up -d

      # 9. Esperar a que Flask acepte conexiones.
      #    "docker compose up -d" regresa en cuanto el contenedor arranca,
      #    pero Flask tarda unos segundos en escuchar en el puerto 5000.
      #    curl --retry por si solo NO reintenta cuando la conexion es
      #    rechazada, por eso se usa un ciclo explicito.
      - name: Esperar a la aplicacion Flask
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ > /dev/null; then
              echo "Aplicacion Flask disponible (intento $i)"
              exit 0
            fi

            echo "Intento $i/30: Flask aun no responde, esperando..."
            sleep 2
          done

          echo "::error::Flask no respondio en localhost:5000 despues de 60 segundos"
          exit 1

      # 10. Probar la calculadora y su conexion con PostgreSQL
      - name: Probar calculadora y PostgreSQL
        run: |
          RESPONSE=$(curl -fsS \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            -X POST http://localhost:5000/calculate \
            -H "Content-Type: application/json" \
            -d '{"numero1":20,"numero2":30,"operacion":"suma"}')

          echo "Respuesta: $RESPONSE"

          echo "$RESPONSE" | grep -q '"resultado":50'
          echo "$RESPONSE" | grep -q '"guardado_en":"db"'

      # 11. Verificar el registro en PostgreSQL
      - name: Verificar datos en PostgreSQL
        run: |
          docker compose exec -T db \
            psql -U admin -d calculadora \
            -c "SELECT * FROM operaciones;"

      # 12. Mostrar los contenedores
      - name: Verificar servicios
        run: docker compose ps

      # 13. Mostrar estado y logs si algo fallo
      - name: Diagnosticar errores de contenedores
        if: failure()
        run: |
          echo "=== ESTADO DE CONTENEDORES ==="
          docker compose ps -a

          echo "=== LOGS DE LA APLICACION ==="
          docker compose logs calculator-app

          echo "=== LOGS DE POSTGRESQL ==="
          docker compose logs db

      # 14. Limpiar los contenedores
      - name: Limpiar entorno
        if: always()
        run: docker compose down
